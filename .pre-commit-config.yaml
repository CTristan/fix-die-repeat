# Pre-commit hooks for fix-die-repeat
# Install: pre-commit install
# Run manually: pre-commit run --all-files

# See https://pre-commit.com for more information
repos:
  - repo: local
    hooks:
      - id: ci
        name: Run centralized CI checks
        entry: ./scripts/ci.sh --check-only
        language: system
        pass_filenames: false
        always_run: true
